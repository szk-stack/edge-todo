services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgetodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: edgetodo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgetodo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://edgetodo:${POSTGRES_PASSWORD}@postgres:5432/edgetodo
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      PORT: 8787
      MAILER: ${MAILER:-console}
    ports:
      - "8787:8787"

volumes:
  pgdata:
